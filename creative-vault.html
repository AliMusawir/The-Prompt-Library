strates modern mobile-priority approach. Makes mobile experience excellent not afterthought.", "hook": "Mobile-first design: Optimized for phone, perfect everywhere", "script": "- 0-5s: \"Mobile experience: Designed for your phone first\"\n- 5-25s: Show mobile optimization and seamless experience\n- 25-40s: \"Touch-optimized. Mobile-perfect. Desktop-excellent.\"\n- 40-50s: \"Try mobile-first - download now\"", "image_prompt": "You are a mobile UX photographer creating mobile-first content for modern design and optimized experience marketing. Create a sleek photograph showing person using product on mobile device with smooth touch interactions and mobile-optimized interface visible demonstrating mobile-first design philosophy creating excellent smartphone experience. Use modern mobile-focused lighting with touch optimization and mobile interface excellence emphasized.", "ad_copy": "1. \"Mobile-first design: Optimized for smartphone use\"\n2. \"Touch-perfect: Designed for mobile, excellent everywhere\"\n3. \"Modern mobile: Interface built for phone-first experience\"", "why": "- Mobile-first demonstrates modern design priority\n- Optimized experience appeals to mobile-dominant users\n- Design philosophy shows user understanding\n- Mobile optimization differentiates from desktop-converted alternatives"}, {"num": 207, "category": "Beauty & Skincare", "name": "Ingredient Sourcing Map", "industry": "Food / Beauty / Ethical Products", "format": "Transparency Visualization", "platform": "Ethical Marketing / Transparency Campaigns", "aspect": "16:9", "goal": "Sourcing Transparency / Ethical Proof", "visual": "Show ingredient origin map. \"Ingredient journey: Where each component comes from.\" Visualizes sourcing transparency. Makes ingredient origins geographic and verifiable.", "hook": "Sourcing map: Track every ingredient to its origin", "script": "- 0-5s: \"Ingredient transparency: Map showing every origin\"\n- 5-30s: Show interactive or visual map with ingredient sources\n- 30-45s: \"Complete traceability. Ethical sourcing mapped.\"\n- 45-50s: \"See sourcing map - shop transparently\"", "image_prompt": "You are a sourcing transparency designer creating ingredient origin content for geographic traceability and ethical sourcing marketing. Create an informative world map showing ingredient sourcing locations with each ingredient origin marked and connected to product demonstrating complete geographic transparency and ethical global sourcing with supply chain fully visualized. Use clean educational design with sourcing geography and ingredient origins clearly mapped.", "ad_copy": "1. \"Sourcing map: Geographic origin of every ingredient\"\n2. \"Ingredient transparency: Track components to source locations\"\n3. \"Origin mapping: Where each ingredient actually comes from\"", "why": "- Geographic visualization makes sourcing concrete and verifiable\n- Map format creates engaging transparency presentation\n- Origin tracking demonstrates ethical sourcing commitment\n- Complete traceability differentiates from opaque competitors"}, {"num": 208, "category": "Subscription & Membership", "name": "Try Before Subscription", "industry": "Subscription Services", "format": "Trial Offer", "platform": "Subscription Marketing / SaaS", "aspect": "1:1", "goal": "Trial Conversion / Risk Reduction", "visual": "Offer no-commitment trial before subscription. \"Try [time period] free. Subscribe only if you love it.\" Removes subscription risk through genuine trial. Makes commitment gradual.", "hook": "Try [X] days free: No card required. Subscribe only if you love it.", "script": "- 0-5s: \"Try before subscribing: [X] days completely free\"\n- 5-20s: Show trial process and full feature access\n- 20-35s: \"No card required. No risk. Love it, then subscribe.\"\n- 35-45s: \"Start free trial - no commitment\"", "image_prompt": "You are a subscription trust photographer creating trial content for risk reduction and confident subscription marketing. Create a reassuring interface showing free trial signup with \"No Credit Card Required\" prominently displayed and full feature access during trial visible demonstrating genuine risk-free trial encouraging confident trying before subscription commitment. Use trust-building design with trial ease and no-risk messaging emphasized.", "ad_copy": "1. \"Free trial: [X] days, no card required, full access\"\n2. \"Try risk-free: Subscribe only after loving it\"\n3. \"No-commitment trial: Experience before subscribing\"", "why": "- Risk-free trial removes subscription anxiety\n- No credit card requirement builds genuine trust\n- Try-first approach increases confident conversions\n- Gradual commitment differentiates from immediate-subscription competitors"}, {"num": 209, "category": "B2B / Professional Services", "name": "Capacity Planning Calculator", "industry": "B2B / Infrastructure Products", "format": "Sizing Tool", "platform": "B2B Marketing / Technical Sales", "aspect": "16:9", "goal": "Buying Confidence / Technical Support", "visual": "Provide capacity planning tool. \"Calculate exact capacity needed.\" Helps buyers size purchase correctly. Makes technical buying decision easier through calculator.", "hook": "Capacity calculator: Size your purchase exactly right", "script": "- 0-5s: \"Sizing purchase? Capacity calculator ensures accuracy\"\n- 5-25s: Show calculator determining exact needs\n- 25-40s: \"Right size. No over-buying. No under-capacity.\"\n- 40-50s: \"Calculate capacity - size correctly\"", "image_prompt": "You are a B2B tools designer creating capacity planning content for accurate sizing and buying confidence marketing. Create a professional calculator interface showing capacity planning tool with user inputs and accurate size recommendation output demonstrating exact capacity calculation preventing over-buying or under-capacity through precise sizing tool. Use professional B2B design with calculator accuracy and sizing confidence emphasized.", "ad_copy": "1. \"Capacity calculator: Size your purchase accurately\"\n2. \"Planning tool: Calculate exact capacity needed\"\n3. \"Right-sizing: Calculator prevents over or under-buying\"", "why": "- Capacity planning reduces buying uncertainty\n- Accurate sizing prevents costly mistakes\n- Calculator demonstrates technical support\n- Planning tool differentiates from guess-based competitors"}, {"num": 210, "category": "Other / Specialty", "name": "Founder Accountability Update", "industry": "Founder-Led Brands", "format": "Transparent Communication", "platform": "Email / Blog / Founder Marketing", "aspect": "9:16 or 1:1", "goal": "Trust Building / Transparent Leadership", "visual": "Regular founder updates on progress and challenges. \"Monthly founder update: What we accomplished and what we're fixing.\" Shows accountability through transparent ongoing communication.", "hook": "Founder monthly update: Wins, challenges, and what's next", "script": "- 0-5s: \"Monthly transparency: Founder update on progress\"\n- 5-30s: Share accomplishments, challenges, customer-driven changes\n- 30-45s: \"Accountable leadership. Transparent progress. Customer-driven.\"\n- 45-50s: \"Subscribe to updates - stay informed\"", "image_prompt": "You are a founder communication photographer creating accountability content for transparent leadership and customer relationship marketing. Create an authentic photograph showing founder delivering honest update with monthly progress visible and transparent communication about both successes and challenges demonstrating accountable leadership and ongoing customer-focused communication. Use honest personal lighting with founder authenticity and transparent communication emphasized.", "ad_copy": "1. \"Founder updates: Monthly transparency on progress and challenges\"\n2. \"Accountable leadership: What we accomplished and what we're fixing\"\n3. \"Monthly transparency: Founder report on wins and improvements\"", "why": "- Regular updates demonstrate ongoing accountability\n- Transparent challenge discussion builds authentic trust\n- Founder communication humanizes brand\n- Honest updates differentiate from silent competitors"}]</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
document.getElementById('totalCount').textContent = DATA.length;

const grid = document.getElementById('grid');
const catRow = document.getElementById('catRow');
const searchInput = document.getElementById('search');
const resultLine = document.getElementById('resultLine');
const emptyEl = document.getElementById('empty');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');

let activeCat = 'All';
let query = '';

// Build category list with counts
const catCounts = {};
DATA.forEach(d => { catCounts[d.category] = (catCounts[d.category]||0) + 1; });
const cats = ['All', ...Object.keys(catCounts).sort()];

function renderCatRow(){
  catRow.innerHTML = '';
  cats.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (c === activeCat ? ' active' : '');
    const count = c === 'All' ? DATA.length : catCounts[c];
    btn.innerHTML = escapeHtml(c) + ' <span class="n">' + count + '</span>';
    btn.addEventListener('click', () => { activeCat = c; renderCatRow(); renderGrid(); });
    catRow.appendChild(btn);
  });
}

function escapeHtml(s){
  if (s === undefined || s === null) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function matches(item, q){
  if (!q) return true;
  const hay = [item.name, item.hook, item.category, item.industry, item.platform, item.format].join(' ').toLowerCase();
  return hay.includes(q);
}

function renderGrid(){
  const q = query.trim().toLowerCase();
  const filtered = DATA.filter(d => (activeCat === 'All' || d.category === activeCat) && matches(d, q));

  grid.innerHTML = '';
  filtered.forEach(item => {
    const card = document.createElement('button');
    card.className = 'card';
    card.setAttribute('type','button');
    card.innerHTML = `
      <div class="card-top">
        <span class="card-no">No. ${String(item.num).padStart(3,'0')}</span>
        <span class="card-cat">${escapeHtml(item.category)}</span>
      </div>
      <h3 class="card-name">${escapeHtml(item.name)}</h3>
      <p class="card-hook">${escapeHtml(item.hook)}</p>
      <div class="card-meta">
        <span><b>${escapeHtml(item.format)}</b></span>
        <span>${escapeHtml(item.platform)}</span>
      </div>
    `;
    card.addEventListener('click', () => openDetail(item));
    grid.appendChild(card);
  });

  emptyEl.style.display = filtered.length ? 'none' : 'block';
  resultLine.innerHTML = filtered.length === DATA.length
    ? `Showing all <strong>${filtered.length}</strong> concepts`
    : `<strong>${filtered.length}</strong> of ${DATA.length} concepts`;
}

function multiline(s){
  return escapeHtml(s).replace(/\n/g,'\n');
}

function numberedList(s){
  if(!s) return '<p class="body-text">—</p>';
  const parts = s.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  return '<ol class="copy-list">' + parts.map(p => '<li>' + escapeHtml(p.replace(/^\d+\.\s*/, '')) + '</li>').join('') + '</ol>';
}

function bulletList(s){
  if(!s) return '<p class="body-text">—</p>';
  const parts = s.split(/\n+/).map(x=>x.trim().replace(/^[-•]\s*/,'')).filter(Boolean);
  return '<ul class="why-list">' + parts.map(p => '<li>' + escapeHtml(p) + '</li>').join('') + '</ul>';
}

function openDetail(item){
  panel.innerHTML = `
    <div class="panel-head">
      <button class="close-btn" id="closeBtn" aria-label="Close">✕</button>
      <div class="panel-eyebrow"><span>No. ${String(item.num).padStart(3,'0')}</span><span class="cat">${escapeHtml(item.category)}</span></div>
      <h2>${escapeHtml(item.name)}</h2>
    </div>
    <div class="meta-grid">
      <div class="meta-cell"><div class="meta-label">Format</div><div class="meta-value">${escapeHtml(item.format)}</div></div>
      <div class="meta-cell"><div class="meta-label">Platform</div><div class="meta-value">${escapeHtml(item.platform)}</div></div>
      <div class="meta-cell"><div class="meta-label">Aspect ratio</div><div class="meta-value">${escapeHtml(item.aspect)}</div></div>
      <div class="meta-cell"><div class="meta-label">Goal</div><div class="meta-value">${escapeHtml(item.goal)}</div></div>
    </div>
    <div class="section">
      <p class="section-label">Hook</p>
      <p class="hook-block">${escapeHtml(item.hook)}</p>
    </div>
    <div class="section">
      <p class="section-label">Visual concept</p>
      <p class="body-text" style="max-width:none;">${escapeHtml(item.visual)}</p>
    </div>
    <div class="section">
      <p class="section-label">Full script</p>
      <div class="copy-block-wrap">
        <button class="copy-btn" data-copy="script">Copy</button>
        <pre class="mono-block">${multiline(item.script)}</pre>
      </div>
    </div>
    <div class="section">
      <p class="section-label">AI image prompt</p>
      <div class="copy-block-wrap">
        <button class="copy-btn" data-copy="image_prompt">Copy</button>
        <pre class="mono-block">${multiline(item.image_prompt)}</pre>
      </div>
    </div>
    <div class="section">
      <p class="section-label">Ad copy options</p>
      ${numberedList(item.ad_copy)}
    </div>
    <div class="section">
      <p class="section-label">Why it works</p>
      ${bulletList(item.why)}
    </div>
    <div style="height:6px;background:var(--navy);"></div>
  `;

  panel.querySelector('#closeBtn').addEventListener('click', closeDetail);
  panel.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const field = btn.getAttribute('data-copy');
      const text = item[field] || '';
      navigator.clipboard.writeText(text).then(() => {
        const original = btn.textContent;
        btn.textContent = 'Copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1400);
      }).catch(() => {});
    });
  });

  overlay.classList.add('open');
  panel.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function closeDetail(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

overlay.addEventListener('click', (e) => { if (e.target === overlay) closeDetail(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

let debounceTimer;
searchInput.addEventListener('input', (e) => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { query = e.target.value; renderGrid(); }, 120);
});

document.getElementById('clear').addEventListener('click', () => {
  query=''; activeCat='All'; searchInput.value='';
  renderCatRow(); renderGrid();
});

renderCatRow();
renderGrid();
</script>
</body>
</html>
